name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Declaring any permissions block zeroes every permission not listed, so the
# read on contents has to be spelled out even though it is the only one.
permissions:
  contents: read

jobs:
  # Each job is filtered to its own directory, so a change to the app does
  # not spend ten minutes compiling Rust to tell you nothing.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'

      - name: Install Rust
        if: steps.changed.outputs.contracts == 'true'
        run: |
          # Pinned, not stable: nearcore's VM rejects wasm built by Rust 1.87
          # and newer, so `contracts/rust-toolchain.toml` names 1.86.0 and the
          # components/target are installed for that toolchain explicitly.
          rustup toolchain install 1.86.0 --profile minimal \
            --component rustfmt --component clippy \
            --target wasm32-unknown-unknown

      - name: Formatting
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo fmt --all -- --check

      # The Collections contracts are held to a clean clippy. The marketplace
      # contract is not: it was written against a `--warn` policy in its own
      # repository and carries pre-existing lints. Turning the whole workspace
      # to `-D warnings` in one step would fail this merge on warnings nobody
      # introduced here, so the two policies are stated separately rather than
      # silently weakened for everything.
      - name: Lint (Collections)
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: |
          cargo clippy \
            -p sheda-collection-raise \
            -p sheda-collection-vault \
            -p sheda-stake-registry \
            --all-targets -- -D warnings

      - name: Lint (marketplace)
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo clippy -p sheda-contract --all-targets -- -W clippy::all

      - name: Unit tests
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo test --workspace --lib -- --nocapture

      # The marketplace contract's tests drive the deployed contract against
      # near-workspaces, so they are integration tests rather than `--lib`
      # unit tests and would otherwise be silently skipped.
      # The marketplace tests build the contract with near_workspaces::compile_project,
      # which shells out to `cargo near`. Without it every marketplace test fails
      # with "no such command: near" and nothing after the tests (including the
      # deploy) ever runs. Same pinned version as the deploy workflow.
      - name: Install cargo-near
        if: steps.changed.outputs.contracts == 'true'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.17.0/cargo-near-installer.sh | sh

      - name: Marketplace integration tests
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo test -p sheda-contract

      - name: Build wasm
        if: steps.changed.outputs.contracts == 'true'
        working-directory: contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # The binaries leave the runner, because a deploy should come from a
      # build anyone can reproduce rather than from somebody's laptop.
      - name: Keep the wasm
        if: steps.changed.outputs.contracts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            backend:
              - 'services/backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.backend == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend/requirements-server.txt

      - name: Install
        if: steps.changed.outputs.backend == 'true'
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt

      - name: Unit tests
        if: steps.changed.outputs.backend == 'true'
        working-directory: services/backend
        # Settings refuses to start without these. They are placeholders,
        # not secrets: the tests run on in-memory SQLite and send no email.
        env:
          SECRET_KEY: ci-placeholder-secret-not-used-anywhere-real
          ADMIN_SECRET_KEY: ci-placeholder-admin-secret-not-used-anywhere
          SMTP_HOST: localhost
          PROD_URL: http://localhost:8000
          DEV_URL: http://localhost:8000
          ADMIN_ROUTE: /admin
          ORIGINS: '["http://localhost:3000"]'
          DB_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: python -m pytest tests/unit -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.web == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm ci

      # Next 16 generates the route prop types (`LayoutProps`, `PageProps`)
      # that the app uses. They do not exist in a fresh checkout, so generate
      # them before asking tsc to check the tree.
      - name: Generate route types
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npx next typegen

      - name: Typecheck
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      # A production build catches route and server/client boundary errors
      # that a typecheck alone does not. The public values are the testnet
      # ones; no secret is needed to compile.
      - name: Build
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api-testnet.sheda.app
          NEXT_PUBLIC_NEAR_NETWORK: testnet
        run: npx next build

  collection-app:
    name: Collections app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            collection:
              - 'apps/collection-app/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.collection == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collection-app/package-lock.json

      - name: Install
        if: steps.changed.outputs.collection == 'true'
        working-directory: apps/collection-app
        run: npm ci

      - name: Typecheck
        if: steps.changed.outputs.collection == 'true'
        working-directory: apps/collection-app
        run: npm run typecheck

      - name: Tests
        if: steps.changed.outputs.collection == 'true'
        working-directory: apps/collection-app
        run: npm test

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        if: steps.changed.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck
        if: steps.changed.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Tests
        if: steps.changed.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: npx jest --watchAll=false
